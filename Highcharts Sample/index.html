<script  type="text/javascript">
$(document).ready(function () {
    $('a').click(function(e) {
		e.preventDefault();
		var link = $(this).attr('href');
		//$(this).attr('target', '_blank');
		openNewTab(link);
	});
});

function openNewTab(link) {
    var frm = $('<form method="get" action="' + link + '" target="_blank"></form>')
    $("body").append(frm);
    frm.submit().remove();
}
</script>
