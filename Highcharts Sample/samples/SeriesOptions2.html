<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html>
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
		<title>Series Options 2</title>
		<script src="../js/jquery-1.12.2.min.js"></script>
		<script src="../js/highcharts.js"></script>
	</head>
	<body>
		<div id="container" style="width:100%; height:300px;"></div>
		<table width="100%">
			<tr>
				<td style="width:50%"><div id="container2" style="width:100%; height:350px;"></div></td>
				<td><div id="container3" style="width:100%; height:350px;"></div></td>
			</tr>
		</table>
	</body>
</html>
<script>
$(function() {
	$('#container').highcharts({
		chart: {
			type: 'spline'
		},
		title: {
			text: 'Dash Style'
		},
		legend: {
			symbolWidth: 80
		},
		series: [{
			name: 'Product A',
			data: [1, 3, 2, 4, 5, 4, 6, 2, 3, 5, 6, 5],
			dashStyle: 'longdash'
		}, {
			name: 'Product B',
			data: [2, 4, 1, 3, 4, 2, 9, 1, 2, 3, 4, 5],
			dashStyle: 'shortdot'
		}]
	});

	$('#container2').highcharts({
		chart: {
			type: 'line'
		},
		title: {
			text: 'Zones'
		},
		xAxis: {
			categories: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
		},
		series: [{
			name: '2015',
			data: [29.9, 71.5, 106.4, 129.2, 144.0, 176.0, 135.6, 148.5, 216.4, 194.1, 95.6, 54.4],
			zones: [{
				value: 100,
				color: '#f7a35c'
			}, {
				value: 150,
				color: '#7798BF'
			}, {
				color: '#ff0066'
			}]
		}]
	});
	
	$('#container3').highcharts({
		chart: {
			type: 'line'
		},
		title: {
			text: 'Zones with Dash Style'
		},
		xAxis: {
			categories: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
		},
		plotOptions: {
            series: {
                color: '#55BF3B'
            }
        },
		series: [{
			name: '2016',
			data: [29.9, 71.5, 106.4, 129.2, 144.0, 176.0, 135.6, 148.5, 216.4, 194.1, 95.6, 54.4],
			zoneAxis: 'x',	// by default zoning is done on the yAxis
			zones: [{
				value: 3
			}, {
				dashStyle: 'dot'
			}]
		}]
	});
});
</script>
