<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html>
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
		<title>Series Options 1</title>
		<script src="../js/jquery-1.12.2.min.js"></script>
		<script src="../js/highcharts.js"></script>
		<script src="../js/themes/grid-light.js"></script>
	</head>
	<body>
		<table width="100%">
			<tr>
				<td style="width:50%"><div id="container" style="width:100%; height:600px;"></div></td>
				<td><div id="container2" style="width:100%; height:600px;"></div></td>
			</tr>
			<tr>
				<td align="right"><button id="btn1" class="autocompare">Get selected points</button></td>
			</tr>
		</table>
	</body>
</html>
<script>
$(function() {
	var chart1 = new Highcharts.Chart({
		chart: {
			type: 'line',
			renderTo: 'container'
		},
		title: {
			text: 'Point Selection'
		},
		xAxis: {
			categories: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
		},
		yAxis: {
			title: {
				text: 'Temperature (°C)'
			}
		},
		plotOptions: {
			series: {
                allowPointSelect: true
            }
		},
		series: [{
			name: 'London (UK)',
			data: [3.9, 4.2, 5.7, 8.5, 11.9, 15.2, 17.0, 16.6, 14.2, 10.3, 6.6, 4.8]
		}]
	});
	
	// the button action
	$('#btn1').click(function() {
		var selectedPoints = chart1.getSelectedPoints();
		var displayMsg = null;
		
		if (selectedPoints.length == 1) {
			displayMsg = 'Selected point is {x=' + selectedPoints[0].category + ', y=' + selectedPoints[0].y + '}';
		} else {
			displayMsg = 'You selected ' + selectedPoints.length + ' points';
		}
		
		if (chart1.lbl) {
			chart1.lbl.destroy();
		}
		chart1.lbl = chart1.renderer.label(displayMsg)
									.attr({
										padding: 10,
										r: 5,
										fill: Highcharts.getOptions().colors[1],
										zIndex: 5
									})
									.css({
										color: 'white'
									})
									.add();
	});
	
	var chart2 = new Highcharts.Chart({
		chart: {
			type: 'line',
			renderTo: 'container2'
		},
		title: {
			text: 'Line Width & Data Label'
		},
		xAxis: {
			categories: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
		},
		yAxis: {
			title: {
				text: 'Temperature (°C)'
			}
		},
		plotOptions: {
			line: {
				dataLabels: {
					enabled: true
				},
				enableMouseTracking: false	//-> Tooltips will not show, and cannot select points
			},
		},
		series: [{
			name: 'Tokyo (JP)',
			data: [2.9, 7.1, 10.6, 12.9, 14.4, 17.6, 21.6, 19.4, 14.8, 13.5, 9.5, 5.4],
			lineWidth: 4
		}, {
			name: 'Queenstown (NZ)',
			data: [21.6, 19.4, 9.5, 5.4, 2.9, 7.1, 10.6, 12.9, 14.4, 17.6, 13.5, 14.8]
		}]
	});
});
</script>
