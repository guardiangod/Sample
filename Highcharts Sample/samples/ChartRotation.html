<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html>
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
		<title>Chart Rotation</title>
		<script src="../js/jquery-1.12.2.min.js"></script>
		<script src="../js/highcharts.js"></script>
		<script src="../js/highcharts-3d.js"></script>
	</head>
	<body>
		<div id="container" style="width:100%; height:400px;"></div>
		<div id="sliders">
			<table>
				<tr>
					<td>Alpha angle</td>
					<td><input type='range' id='alpha' min='0' max='45' value='0'/></td>
					<td><span id='alpha_value' class='value'></span></td>
				</tr>
				<tr>
					<td>Beta angle</td>
					<td><input type='range' id='beta' min='0' max='45' value='0'/></td>
					<td><span id='beta_value' class='value'></span></td>
				</tr>
				<tr>
					<td>Depth angle</td>
					<td><input type='range' id='depth' min='0' max='100' value='50'/></td>
					<td><span id='depth_value' class='value'></span></td>
				</tr>
			</table>
		</div>
	</body>
</html>
<script>
var chart = null;
var options = {
	chart: {
		renderTo: 'container',
		type: 'column',
		options3d: {
			enabled: true,
			alpha: 0,
			beta: 0,
			depth: 50,
			viewDistance: 10
		}
	},
	title: {
		text: 'Chart Rotation Demo'
	},
	subtitle: {
		text: 'Test options by dragging the sliders below'
	},
	plotOptions: {
		column: {
			depth: 25
		}
	},
	xAxis: {
		categories: ['2011', '2012', '2013', '2014', '2015', '2016']
	},
	series: [{
		name: 'Import',
		data: [29.9, 71.5, 106.4, 129.2, 144.0, 176.0]
	}]
};
	
$(document).ready(function() {
	options.series.push({
		name: 'Export',
		data: [135.6, 148.5, 216.4, 194.1, 95.6, 54.4]
	});
	
	chart = new Highcharts.Chart(options);
	showValues();
	
	// Activate the sliders
	$('#sliders input[type="range"]').change(function () {
		chart.options.chart.options3d[this.id] = this.value;
		showValues();
		chart.redraw(false);
	});
});

function showValues() {
	$('#alpha_value').html(chart.options.chart.options3d.alpha);
	$('#beta_value').html(chart.options.chart.options3d.beta);
	$('#depth_value').html(chart.options.chart.options3d.depth);
}
</script>
